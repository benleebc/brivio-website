<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brivio · Bid review</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A1A2F;--ink2:#13263F;--line:#24384F;--mute:#9AA8B8;--paper:#F3F5F8;--hi:#FFFFFF;--ok:#3FB97A;--warn:#E0A43A;--font:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--ink);color:var(--hi);-webkit-font-smoothing:antialiased}
a{color:var(--hi)}a:hover{color:#cfe0f5}
button{font:inherit;color:inherit;cursor:pointer}
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.gate h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.gate p{margin:0 0 6px;color:var(--mute);font-size:14px;line-height:1.5}
.gate input{font:inherit;font-size:16px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink2);color:var(--hi);outline:none}
.gate input:focus{border-color:#5B8BD0}
.gate .go{padding:13px;border-radius:10px;border:0;background:var(--hi);color:var(--ink);font-weight:600}
.gate .err{color:#F08A8A;font-size:13px;min-height:18px}
.app{display:none;flex-direction:column;height:100%}
.app.on{display:flex}
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--mute);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;color:var(--mute)}
.tab:hover{color:var(--hi)}
.tab[aria-pressed="true"]{background:var(--hi);color:var(--ink);border-color:var(--hi)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.tab.draft .dot{background:var(--warn)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink2);color:var(--hi)}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 11px;font-size:13px;color:var(--mute);text-decoration:none;white-space:nowrap}
.btn:hover{color:var(--hi)}
.meta{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:12.5px;color:var(--mute);border-bottom:1px solid var(--line);flex-wrap:wrap}
.meta b{color:var(--hi);font-weight:600}
.safe{display:flex;align-items:center;gap:6px;color:var(--ok)}
.stage{flex:1;min-height:0;background:#0E2036;display:flex;justify-content:center;overflow:auto}
.stage iframe{border:0;background:#fff;width:100%;height:100%;display:block}
.stage.mobile{padding:24px 0}
.stage.mobile iframe{width:390px;height:844px;max-height:100%;border-radius:18px;box-shadow:0 0 0 8px #000,0 20px 50px rgba(0,0,0,.5)}
.empty{align-self:center;text-align:center;color:var(--mute);font-size:15px;line-height:1.6;padding:24px}
.arch{position:relative}
.btn.on{color:var(--hi);border-color:#5B8BD0}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:220px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;flex-direction:column;gap:2px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.menu.open{display:flex}
.menu .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:6px 10px 4px}
.menu button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:7px;padding:9px 10px;font-size:14px;color:var(--hi)}
.menu button:hover,.menu button[aria-pressed="true"]{background:#1C3250}
.pick{display:none;flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink2);color:var(--hi)}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
@media (max-width:700px){
.bar{flex-wrap:nowrap;gap:8px;padding:8px 10px}
.brand span,.tabs,.tools .seg,#open{display:none}
.brand{font-size:14px}
.pick{display:block}
.tools{gap:6px}
.btn{padding:9px 10px}
.meta{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:6px 10px;font-size:12px;gap:12px}
.meta .fn{display:none}
.stage.mobile{padding:0}
}
</style>
</head>
<body>
<div class="gate" id="gate">
<form id="f" autocomplete="off">
<h1>Bid review</h1>
<p>Brivio internal. Pages viewed here don't send Clarity, Formspree, or Apollo alerts.</p>
<input id="pw" type="text" placeholder="Password" autofocus>
<button class="go" type="submit">Unlock</button>
<div class="err" id="err"></div>
</form>
</div>
<div class="app" id="app">
<div class="bar">
<div class="brand">Brivio <span>· Bid review</span></div>
<div class="tabs" id="tabs"></div>
<select class="pick" id="pick" aria-label="Select bid"></select>
<div class="tools">
<div class="seg" id="dev"><button data-d="desktop" aria-pressed="true">Desktop</button><button data-d="mobile" aria-pressed="false">Mobile</button></div>
<div class="arch"><button class="btn" id="archBtn" aria-haspopup="true" aria-expanded="false">Archived</button><div class="menu" id="archMenu" role="menu"></div></div>
<a class="btn" id="open" target="_blank" rel="noopener">Open in tab</a>
<button class="btn" id="lock">Lock</button>
</div>
</div>
<div class="meta" id="meta"></div>
<div class="stage" id="stage"></div>
</div>
<script>
const PAYLOAD={"s":"VxDx0EX6gvnOKYANHeR9bA==","i":"itNFUWzd0CqC/J0H","c":"Bo1dzGF09zHt7E8SVkRFmr6jnLYkZhFJRD5I93CP0Gr403nmzrdXlXax2Wh40n2eUv1rvXrv08L5mrfY8DAAZXV2m4+Mpe638w+N2GTkGCDn1uLXRbNB+OqLHSKe64oK7iHEHyfrikucXtrEHk5RsYm/Ke2Y+bBeijWco6ELiD55ZIk64mgZSw1QCN9N4R60RZ06s0fq3HHJtz1XOU8h76VaEp0Ckbjr/083MJvFiu3JhPniWeNOtKuGcI326VvJ8w1o3Na4qELzgv023QOu33+qTSBE56wTRAq+staQcLvxi/fwHeEcDEiSoshGg97HdzlNxRbJSp7WVDBG7u2fVOKSikyNEUnw2YHoR6HR2TKOYOmBeqWbhsP5Ez4/CM8VU2HKVLDd+o46AgJL+4VB7e5juLl21h/TdXsQ9V2NQyFk7mMznoIQEOCmgVU6DLhjadQcrq0kQvUln+ed5EH/exkqW+j0jG+1DKLLRMz/ZfLT8einZTRet8cy4ZYuhm9vtr95HLlaMDjzKEkJaFKcdEBGzWoXaqJyxDk4VqtnSsVyRwyUeTT0Rc0r+7Tv+/1cZQsCOYUXt2YQhwBHTb8Z49WWKXlBBQU9AY9YozxClJ8t9Q+w6ctoh4Ym3GIKkPyQhjBE2Tsl+cMOJ/dboOibtO8ByP0244cy3tSRO/vYYVmS3yhG5BCrBqy1cG52WKNjv5ymjRDDkhhwtxqjif9nydcpAZmJDDnBFtP7DAcvBevqFJyfKPEOLStjpLe6wtIUDAaJbK9TgR1QhT+FjR9ELaqluqTFru/fEIvePh4g3wYMUs4vcCKSO8SaLArbvyJci1GblnhdpLKY530S2Bsz0N6Py+yWxXlzoI544p7psMmJAmMwimGjkiMPXhLPM6rlOzCxhPR6iCNqlSZ52sarF9zDU47l1vH62YI2hzaPLaNVuzF+W7jNW+YxueNf6UTFcqCOB34fi8Ew9ezBc1rOjGF23iZYTh6cKaeHoP2B9pW0bqcsUlnT83QPIuDvWtYieEDm9Wo=","n":250000};
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.s),iterations:PAYLOAD.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.i)},key,b64(PAYLOAD.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
let bids=[],cur=0,device='desktop';
const withNotrack=u=>u+(u.includes('?')?'&':'?')+'notrack=1&v='+Date.now();
function render(){
  const b=bids[cur];
  const act=bids.map((x,i)=>[x,i]).filter(([x])=>!x.archived),arc=bids.map((x,i)=>[x,i]).filter(([x])=>x.archived);
  $('tabs').innerHTML=act.map(([x,i])=>`<button class="tab${x.status==='draft'?' draft':''}" data-i="${i}" aria-pressed="${i===cur}"><span class="dot"></span>${x.name}</button>`).join('');
  $('pick').innerHTML=act.map(([x,i])=>`<option value="${i}"${i===cur?' selected':''}>${x.name}</option>`).join('')+(arc.length?`<optgroup label="Archived">${arc.map(([x,i])=>`<option value="${i}"${i===cur?' selected':''}>${x.name}</option>`).join('')}</optgroup>`:'');
  $('archMenu').innerHTML='<div class="h">Archived bids</div>'+arc.map(([x,i])=>`<button role="menuitem" data-i="${i}" aria-pressed="${i===cur}"><span class="dot"${x.status==='draft'?' style="background:var(--warn)"':''}></span>${x.name}</button>`).join('');
  $('archBtn').classList.toggle('on',!!b.archived);
  $('meta').innerHTML=`<span><b>${b.name}</b></span>${b.archived?'<span class="tag">Archived</span>':''}<span>${b.status==='draft'?'Draft':'Live'}${b.sent?' · Sent '+b.sent:''}</span><span class="fn">${b.file}</span><span class="safe">● Untracked view</span>`;
  const st=$('stage');st.className='stage'+(device==='mobile'?' mobile':'');
  {st.innerHTML=`<iframe src="${withNotrack(b.file)}" title="${b.name}"></iframe>`;$('open').style.display='';$('open').href=withNotrack(b.file);}
  localStorage.setItem('brivio_review_cur',cur);
}
function start(list){
  bids=list;
  try{localStorage.setItem('brivio_notrack','1');}catch(e){}
  const sv=localStorage.getItem('brivio_review_cur');cur=sv===null?bids.findIndex(x=>!x.archived):Math.min(+sv,bids.length-1);
  $('gate').style.display='none';$('app').classList.add('on');render();
}
$('f').onsubmit=async e=>{
  e.preventDefault();$('err').textContent='';
  try{const pw=$('pw').value;const list=await decrypt(pw);sessionStorage.setItem('brivio_review_pw',pw);start(list);}
  catch(x){$('err').textContent='Wrong password.';$('pw').select();}
};
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(t){cur=+t.dataset.i;render();}};
$('dev').onclick=e=>{const t=e.target.closest('button');if(!t)return;device=t.dataset.d;[...$('dev').children].forEach(c=>c.setAttribute('aria-pressed',c===t));render();};
$('pick').onchange=e=>{cur=+e.target.value;render();};
const closeMenu=()=>{$('archMenu').classList.remove('open');$('archBtn').setAttribute('aria-expanded','false');};
$('archBtn').onclick=e=>{e.stopPropagation();const o=$('archMenu').classList.toggle('open');$('archBtn').setAttribute('aria-expanded',o);};
$('archMenu').onclick=e=>{const t=e.target.closest('button');if(t){cur=+t.dataset.i;closeMenu();render();}};
document.addEventListener('click',e=>{if(!e.target.closest('.arch'))closeMenu();});
$('lock').onclick=()=>{sessionStorage.removeItem('brivio_review_pw');location.reload();};
const saved=sessionStorage.getItem('brivio_review_pw');
if(saved)decrypt(saved).then(start).catch(()=>sessionStorage.removeItem('brivio_review_pw'));
</script>
</body>
</html>
