  <!--
  ══════════════════════════════════════════════════════════════════
  CLAUDE DESIGN HANDOFF SPEC (keep this comment when migrating)
  ══════════════════════════════════════════════════════════════════
  Brand tokens: navy #0D1B2A (bg), brass #B99B5F (accent),
  coral #F2675A (alert/stress), ink #1F2328, paper #F5F7F9 (text),
  muted rgba(245,247,249,.62). Font: Inter / InterVariable.

  DATA MODEL
  - BRANDS: map of brand group -> { loan: avg amount financed ($),
    mix: [prime 740+, nearPrime 640-739, subprime <640] shares }
  - BANDS (P / NP / SP), each with:
      part  = Tier 1 dealer participation, % of originated principal (upfront, one-time)
      u     = unlevered net return, % of avg assets (yield - losses - servicing)
      adv   = Tier 2 senior advance rate
      cof   = Tier 2 senior participation cost
      ay    = average asset-years per $1 originated (steady-state book multiplier)
      stress= incremental net loss (bps) applied in stress case
  - T3: warehouse advance 80% all bands, cost 6.5%
  - HURDLE: dealer's opportunity cost of capital (default 6.0%)

  FORMULAS (per rooftop, then summed)
    annualOrig[band] = rooftops' monthlyLoans x 12 x avgLoan x mixShare
    Tier 1 income    = SUM(annualOrig[band] x part[band]); capital = 0
    Tier 2:
      prime sold whole-loan -> dealer keeps prime participation upfront
      NP/SP: dealer retains junior slice
        book    = annualOrig x ay                  (steady-state outstanding)
        capital = book x (1 - adv)
        L       = adv / (1 - adv)
        ROE     = u + L x (u - cof)                (u reduced by stress bps if stressed)
        income  = capital x ROE
    Tier 3 (full captive):
      all bands: equity = book x 20%; ROE = u + 4 x (u - 6.5%)
      income = SUM(equity x ROE); no upfront participation (loans held, not sold)
    Incremental vs baseline = income - capital x HURDLE
  ══════════════════════════════════════════════════════════════════
  -->
